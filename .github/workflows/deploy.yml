name: Deploy to office server

on:
  push:
    branches: [master]
  workflow_dispatch:

concurrency:
  group: ksa-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: [self-hosted, ksa-deploy]
    timeout-minutes: 20
    steps:
      - name: Run deploy-docker.sh on server
        run: /var/www/ksa-embassy-app/deploy-docker.sh
